apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgemirror
spec:
  template:
    spec:
      containers:
        - name: forgemirror
          env:
            - name: FORGEMIRROR_STATE__DATABASE
              value: /var/lib/forgemirror/state.db
          volumeMounts:
            - name: state
              mountPath: /var/lib/forgemirror
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: forgemirror-state
