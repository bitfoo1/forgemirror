# Publishes the documentation site (docs/) to the web host via rsync over
# SSH. Kept separate from CI so that the changelog/release job stays the last
# job there and a failing docs upload can never block a release.
#
# The job only runs once the target is configured (repository → Settings →
# Actions):
#   Variables  DOCS_DEPLOY_TARGET    user@host:/document/root/ (trailing slash);
#                                    user@host: for an rrsync-restricted key
#              DOCS_BASE_URL         public URL, e.g. https://forgemirror.example.org/
#              DOCS_SSH_KNOWN_HOSTS  pinned host key line(s) of the target
#   Secrets    DOCS_SSH_KEY          base64-encoded private deploy key
#              GH_TOKEN              optional; avoids GitHub rate limits in mise

name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      # Pages embed these files from the repository.
      - forgemirror.example.yaml
      - charts/forgemirror/values.yaml
      - deploy/configmap.yaml
      - mise.toml
      - .forgejo/workflows/docs.yaml
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    name: publish
    if: vars.DOCS_DEPLOY_TARGET != ''
    runs-on: docker
    container:
      image: node:24-trixie@sha256:6e5d4c38403930b420404f190be8563396dca2bd156a6cb4722707b0efcf6fc1
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # rsync: transport to the web host (a system tool, not available
          # through mise; git and openssh-client come with the image).
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends rsync >/dev/null
          git clone --quiet "https://oauth2:${TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "${GITHUB_SHA}"

      # Caches mise's data dir in the runner's cache server, keyed on
      # mise.toml/mise.lock. github_token must be a GitHub token: the default
      # (github.token) is the Forgejo token and GitHub would reject it.
      - name: Install mise and tools
        uses: https://github.com/jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8 # keep in step with the local mise version
          github_token: ${{ secrets.GH_TOKEN }}
          # Only what the docs need: hugo, go (Hugo modules) and lychee.
          install_args: go hugo lychee

      - name: Check
        run: mise run docs:check

      - name: Publish
        env:
          DOCS_DEPLOY_TARGET: ${{ vars.DOCS_DEPLOY_TARGET }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
          DOCS_SSH_KNOWN_HOSTS: ${{ vars.DOCS_SSH_KNOWN_HOSTS }}
          DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
        run: mise run docs:publish
