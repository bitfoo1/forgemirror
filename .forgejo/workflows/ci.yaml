# CI/CD for forgemirror. Every step calls a mise task, so this file only
# decides *when* things run; *what* runs is identical to local development and
# the git hooks.
#
# Runner constraints on git.bitfoo.de (forgejo-runner, `runs-on: docker`):
# - Jobs run in node:24-trixie: node for JavaScript actions (mise-action,
#   actions/cache), and the buildpack-deps base already ships git, curl,
#   gcc and libc6-dev, so no apt step is needed.
# - actions/cache talks to the runner's cache server (runner-cache in the
#   forgejo-runner namespace); pull requests get write-isolated entries.
# - No Docker daemon for jobs; images are built daemonless by ko.
#
# Secrets:
#   RELEASE_TOKEN       PAT (write:repository) — pushes release/next and
#                       opens the release PR so that CI runs on it.
#   PACKAGE_RW_TOKEN    PAT (write:package) — pushes the container image.
#   COSIGN_PRIVATE_KEY  cosign key (PEM) — signs checksums and the image.
#   COSIGN_PASSWORD     password of the cosign key.
#   GH_TOKEN            optional GitHub token; avoids GitHub API rate limits
#                       when mise downloads tools.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  verify:
    name: verify
    if: github.ref_type != 'tag'
    runs-on: docker
    container:
      image: node:24-trixie@sha256:6e5d4c38403930b420404f190be8563396dca2bd156a6cb4722707b0efcf6fc1
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git clone --quiet "https://oauth2:${TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "${GITHUB_SHA}"

      # Caches mise's data dir in the runner's cache server, keyed on
      # mise.toml/mise.lock. github_token must be a GitHub token: the default
      # (github.token) is the Forgejo token and GitHub would reject it.
      - name: Install mise and tools
        uses: https://github.com/jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7 # keep in step with the local mise version
          github_token: ${{ secrets.GH_TOKEN }}

      # Module downloads and compiled packages dominate the job time. The key
      # only changes with dependencies or the Go version, so the build cache
      # is refreshed then; in between, restored entries still cover most
      # packages.
      - name: Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-

      - name: Commit messages
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            range="$(mise exec -- jq -r '.pull_request.base.sha + ".." + .pull_request.head.sha' "${GITHUB_EVENT_PATH}")"
          else
            range="$(mise exec -- jq -r '.before + ".." + .after' "${GITHUB_EVENT_PATH}")"
            case "${range}" in 0000000000000000000000000000000000000000..*) range="${GITHUB_SHA}~1..${GITHUB_SHA}" ;; esac
          fi
          mise run commits:check "${range}"

      - name: Quality gate
        run: mise run check

      - name: Snapshot build
        run: mise run snapshot

  changelog:
    name: changelog
    needs: verify
    # Tag pipelines skip verify (the tagged commit was verified on main), so
    # this job must not depend on its success there.
    if: always() && (needs.verify.result == 'success' || github.ref_type == 'tag')
    runs-on: docker
    container:
      image: node:24-trixie@sha256:6e5d4c38403930b420404f190be8563396dca2bd156a6cb4722707b0efcf6fc1
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git clone --quiet "https://oauth2:${TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "${GITHUB_SHA}"

      # Caches mise's data dir in the runner's cache server, keyed on
      # mise.toml/mise.lock. github_token must be a GitHub token: the default
      # (github.token) is the Forgejo token and GitHub would reject it.
      - name: Install mise and tools
        uses: https://github.com/jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7 # keep in step with the local mise version
          github_token: ${{ secrets.GH_TOKEN }}

      # Module downloads and compiled packages dominate the job time. The key
      # only changes with dependencies or the Go version, so the build cache
      # is refreshed then; in between, restored entries still cover most
      # packages.
      - name: Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-

      - name: Changelog preview (pull request)
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run changelog:preview --pr "$(mise exec -- jq -r .pull_request.number "${GITHUB_EVENT_PATH}")"

      # Runs before release:pr on purpose: after a release PR merge the tag
      # must exist before the next release PR is calculated from it.
      - name: Publish release (merged release PR or pushed tag)
        if: github.event_name == 'push'
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_RW_TOKEN: ${{ secrets.PACKAGE_RW_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: mise run release:publish

      - name: Update release PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: mise run release:pr
