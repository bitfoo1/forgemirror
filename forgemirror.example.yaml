# yaml-language-server: $schema=https://forgemirror.bitfoo.de/schema/v1/forgemirror.schema.json
# forgemirror example configuration. Copy to forgemirror.yaml and adjust.
# The line above gives editors completion and validation (see the
# "Editor support" section of the configuration docs).
#
# Every key can also be set via environment variables: prefix FORGEMIRROR_,
# upper case, nesting with a double underscore, e.g.
#   FORGEMIRROR_SERVER__LISTEN_ADDRESS=:9000
#   FORGEMIRROR_WEBHOOK__SECRET_FILE=/run/secrets/webhook
# Precedence: defaults < this file < environment < CLI flags.
# Values shown are the defaults unless marked "required".

server:
  listen_address: ":8080"
  read_header_timeout: 10s
  # Upper bound for a graceful shutdown, including running mirrors.
  shutdown_timeout: 60s

log:
  level: info # debug, info, warn, error
  format: json # json, text

webhook:
  # required: the secret configured on the Forgejo webhook. Use either the
  # value or secret_file (e.g. a mounted Kubernetes Secret), not both.
  secret: change-me
  # secret_file: /run/secrets/forgemirror/webhook-secret
  max_body_bytes: 5242880

# Credentials for cloning private repositories from Forgejo. Leave the token
# empty if only public repositories are mirrored.
source:
  # Recommended: payloads whose clone URL is not below this URL are rejected,
  # so the token is only ever sent to your Forgejo. Empty accepts any URL.
  base_url: "" # e.g. "https://git.example.org/"
  username: oauth2
  # token_file: /run/secrets/forgemirror/source-token

# What starts a mirror run. Scheduled runs and typed targets (see targets)
# read from the Forgejo API, so they need source.base_url and a source token.
sync:
  # Forgejo push webhooks start runs. false requires a schedule; the webhook
  # secret is then only needed if a target sets delete.
  on_push: true
  # Interval between runs over all repositories the source token can see;
  # 0s disables scheduled runs. e.g. 1h
  schedule: 0s

mirror:
  # Upper bound for one clone + push to one target.
  timeout: 10m
  # Upper bound for git operations running at the same time; forge API steps
  # of typed targets are capped separately by the same number.
  max_concurrent: 4
  git_binary: git
  # Where temporary clones are created; empty uses the OS temp directory.
  work_dir: ""

# Which pushes are mirrored. All rules are optional; without them every push
# is mirrored. Patterns are Go regular expressions that must match the whole
# value ("app" does not match "my-app"; use "app.*").
filter:
  # Matched against "owner/name". Exclude wins over include.
  include_repos: ""
  exclude_repos: ""
  # Only pushes to these branches trigger a mirror; tag pushes always do.
  include_branches: [] # e.g. ["main", "release/.*"]
  exclude_private: false
  # Private repositories matching this pattern pass exclude_private. They are
  # created and kept private on every target.
  allow_private: "" # e.g. "acme/notes"
  exclude_forks: false
  # Opt-in: only repositories with this Forgejo topic are mirrored. Not an
  # access control: every repository owner can set topics.
  require_topic: "" # e.g. "mirror"

# required: at least one target. `url` is a Go text/template rendered with
# the repository: {{ .Owner }}, {{ .Name }}, {{ .FullName }}.
# A URL without {{ .Owner }} maps acme/app and bob/app to the same mirror;
# pair it with filter.include_repos (e.g. "acme/.*") on shared instances.
targets:
  - name: github
    url: "https://github.com/acme/{{ .Name }}.git"
    username: oauth2
    token: change-me
  - name: codeberg
    url: "https://codeberg.org/{{ .Owner }}/{{ .Name }}.git"
    token_file: /run/secrets/forgemirror/codeberg-token
    # Optional forge API integration. Without `type` the target is only a git
    # push destination (the repository must already exist) and none of the
    # keys below may be set.
    # type: github # github, gitlab, forgejo
    # api_url: "" # derived from type and the url host when empty
    # create: false # create the repository when it is missing
    # delete: false # delete it when the source repository was deleted
    # prune_labels: false # delete labels that do not exist on the source
    # Target-wide settings; they win over the values of the Forgejo repository.
    # All keys are optional; `private` accepts only true.
    # settings:
    #   description: ""
    #   website: ""
    #   topics: []
    #   default_branch: main
    #   private: true
    #   has_issues: false
    #   has_wiki: false
    #   has_pull_requests: true
    #   labels: true # false disables label sync
    # Matched against "owner/name" (whole value); applied in order on top of
    # `settings`, later entries win.
    # overrides:
    #   - repos: "acme/app"
    #     settings:
    #       has_issues: true
