# mise is the single entry point for this project: it pins every tool, defines
# every task (file tasks live in mise-tasks/) and wires up the git hooks.
# Local development, the git hooks and CI all go through `mise run <task>`, so
# they cannot drift apart. `mise tasks` lists everything.

[tools]
git-lfs = "3.8.1"
go = "1.27.4"
node = "26.13.1"
"npm:@playwright/test" = "1.65.1"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
goreleaser = "2.20.2"
git-cliff = "2.14.2"
cosign = "3.1.4"
syft = "1.57.1" # goreleaser shells out to syft to generate SBOMs
jq = "1.8.2"
kustomize = "5.8.3"
kubeconform = "0.8.0"
helm = "4.3.2"
yq = "4.54.3"
hugo = "0.170.0"
lychee = "0.24.2"
# test:e2e runs Forgejo in Docker; CI job images ship neither CLI. The
# standalone compose binary is used because a CLI plugin would need
# per-machine docker config to be found.
docker-cli = "29.9.3"
docker-compose = "v5.7.1"

[hooks]
# Point git at the versioned hooks in .githooks/. `enter` covers developers
# with an activated shell; `postinstall` covers `mise install` (fresh clones,
# shells without `mise activate`).
enter = { task = "setup:git-hooks" }
postinstall = { task = "setup:git-hooks" }
