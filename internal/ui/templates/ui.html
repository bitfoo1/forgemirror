{{define "page" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{{- /* The indicator styles would be injected as an inline <style>, which the
Content-Security-Policy forbids; eval and script tags are never needed. */}}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>ForgeMirror</title>
<link rel="stylesheet" href="static/style.css">
{{- /* Not deferred: it applies the stored theme before the first paint. */}}
<script src="static/app.js"></script>
<script src="static/live.js" defer></script>
<script src="static/htmx.min.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>ForgeMirror</h1>
    <span class="version">{{.Version}}</span>
  </div>
  <div class="topbar-end">
    {{- if .Auto}}
    <span class="pill pill-ok" title="Pushes, scheduled runs and deletions are applied automatically">Auto sync</span>
    {{- else}}
    <span class="pill pill-warn" title="Changes reach the targets only when you press Sync">Review mode</span>
    {{- end}}
    <button type="button" id="theme-toggle" class="btn btn-ghost" hidden aria-live="polite">Theme: system</button>
  </div>
</header>
<main>
  <section id="overview" class="tiles" hx-get="fragments/overview" hx-trigger="every {{.Refresh}}" hx-swap="innerHTML" hx-sync="this:drop">
    {{template "overview" .}}
  </section>
  <section id="repos" class="card" hx-get="fragments/repos" hx-trigger="every {{.Refresh}}" hx-swap="innerHTML" hx-sync="this:drop">
    {{template "repos" .}}
  </section>
  <section class="card">
    <div class="card-head">
      <h2>Logs</h2>
      <form class="toolbar" action="./" method="get">
        <label for="log-level">Level</label>
        <select id="log-level" name="level" hx-get="fragments/logs" hx-target="#logs" hx-trigger="change">
          {{- range .Levels}}
          <option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
          {{- end}}
        </select>
        <noscript><button type="submit" class="btn">Filter</button></noscript>
      </form>
    </div>
    <div id="logs" class="scroll logs-box" hx-get="fragments/logs" hx-trigger="every {{.Refresh}}" hx-include="#log-level" hx-swap="innerHTML" hx-sync="this:drop">
      {{template "logs" .}}
    </div>
  </section>
  <details class="card config">
    <summary><h2>Configuration</h2><span class="muted">effective, secrets redacted</span></summary>
    <p class="muted">Effective configuration after defaults, file, environment and flags. Secrets are redacted.</p>
    <pre>{{.Config}}</pre>
  </details>
</main>
<footer class="foot muted">Live data checked every {{.Refresh}} · updates pause while selecting text</footer>
</body>
</html>
{{- end}}

{{define "overview" -}}
<div class="tile">
  <span class="tile-label">Uptime</span>
  <span class="tile-value">{{since .Snapshot.Started}}</span>
  <span class="tile-note">since <time datetime="{{iso .Snapshot.Started}}">{{clock .Snapshot.Started}} UTC</time></span>
</div>
<div class="tile">
  <span class="tile-label">Targets</span>
  <ul class="kinds">
    {{- range .Types}}
    <li class="kind{{if .Names}} kind-on{{end}}" title="{{if .Names}}{{range $i, $n := .Names}}{{if $i}}, {{end}}{{$n}}{{end}}{{else}}not configured{{end}}">{{.Label}}</li>
    {{- end}}
  </ul>
</div>
<div class="tile">
  <span class="tile-label">Push webhooks</span>
  <span class="tile-value">{{if .OnPush}}<span class="ok">on</span>{{else}}<span class="muted">off</span>{{end}}</span>
  <span class="tile-note">{{if .OnPush}}{{if .Auto}}pushes are mirrored{{else}}pushes refresh the diff{{end}}{{else}}ignored{{end}}</span>
</div>
<div class="tile">
  <span class="tile-label">Schedule</span>
  {{- with .Snapshot.Schedule}}
    {{- if .Interval}}
  <span class="tile-value">every {{.Interval}}</span>
  <span class="tile-note">
      {{- if .LastRun.IsZero}}first sweep running
      {{- else if .Error}}<span class="fail">last sweep failed</span> <span class="err">{{.Error}}</span>
      {{- else}}last <time datetime="{{iso .LastRun}}">{{when .LastRun}}</time>: {{.Repos}} {{plural .Repos "repository" "repositories"}} · next around <time datetime="{{iso (nextSweep .)}}">{{clock (nextSweep .)}} UTC</time>
      {{- end}}
  </span>
    {{- else}}
  <span class="tile-value muted">off</span>
  <span class="tile-note">no scheduled runs</span>
    {{- end}}
  {{- end}}
</div>
<div class="tile">
  <span class="tile-label">Running</span>
  <span class="tile-value">{{.Running}}</span>
  <span class="tile-note">{{plural .Running "repository" "repositories"}}{{if .Queued}}, {{.Queued}} queued{{end}}</span>
</div>
{{- end}}

{{define "repos" -}}
<div class="card-head">
  <div>
    <h2>Repositories</h2>
    <p class="summary">
      {{- len .Repos}} {{plural (len .Repos) "repository" "repositories"}}
      {{- if .Counts.OutOfSync}} · <span class="warn">{{.Counts.OutOfSync}} out of sync</span>{{end}}
      {{- if .Counts.Failed}} · <span class="fail">{{.Counts.Failed}} failed</span>{{end}}
    </p>
  </div>
  {{- if .Actions}}
  <div class="toolbar" hx-sync="#repos:queue all">
    <form method="post" action="actions/refresh" hx-post="actions/refresh" hx-target="#repos" hx-swap="innerHTML">
      <button type="submit" class="btn">Refresh all</button>
    </form>
    <form method="post" action="actions/sync" hx-post="actions/sync" hx-target="#repos" hx-swap="innerHTML"
      hx-confirm="Sync all {{.Counts.Pending}} out-of-sync repositories to the targets?">
      <button type="submit" class="btn btn-primary"{{if not .Counts.Pending}} disabled{{end}}>Sync all{{if .Counts.Pending}} ({{.Counts.Pending}}){{end}}</button>
    </form>
  </div>
  {{- end}}
</div>
{{- with .Notice}}
<p class="notice" role="status" data-live-key="action-notice">{{.}}</p>
{{- end}}
{{- with .Snapshot.Error}}<p class="notice fail" role="alert">{{.}}</p>{{end}}
{{- if not .Repos}}
<p class="empty muted">No repositories yet. They appear after the first push, scheduled sweep or refresh.</p>
{{- else}}
<ul class="repos" data-live-key="repository-list">
  {{- range $r := .Repos}}
  <li class="repo state-{{$r.State}}" data-live-key="repo:{{$r.Name}}">
    <div class="repo-head" data-live-key="repository-heading">
      <span class="dot" aria-hidden="true"></span>
      <code class="repo-name">{{$r.Name}}</code>
      {{template "state" $r}}
      {{- if $r.Running}}
      <span class="pill pill-info">{{if $r.Applying}}syncing{{else}}planning{{end}}</span>
      {{- if $r.Queued}}<span class="pill pill-muted">queued</span>{{end}}
      {{- end}}
      {{- with $r.Current}}
      <span class="checked muted">checked <time datetime="{{iso .At}}">{{when .At}}</time></span>
      {{- end}}
      {{- if and $.Actions $r.Actionable}}
      <div class="repo-actions" data-live-key="repository-actions" hx-sync="#repos:queue all">
        <form method="post" action="actions/refresh" hx-post="actions/refresh" hx-target="#repos" hx-swap="innerHTML">
          <input type="hidden" name="repo" value="{{$r.Name}}">
          <button type="submit" class="btn btn-small">Refresh</button>
        </form>
        <form method="post" action="actions/sync" hx-post="actions/sync" hx-target="#repos" hx-swap="innerHTML">
          <input type="hidden" name="repo" value="{{$r.Name}}">
          <button type="submit" class="btn btn-small{{if eq $r.State "out-of-sync"}} btn-primary{{end}}">Sync</button>
        </form>
      </div>
      {{- end}}
    </div>
    <details class="diff" data-live-key="current:{{$r.Name}}" data-key="current:{{$r.Name}}"{{if and (eq $r.State "out-of-sync") (not $.Auto)}} data-open-default{{end}}>
      <summary>Current diff{{if $r.Changes}} · {{$r.Changes}} {{plural $r.Changes "change" "changes"}}{{end}}{{if $r.Stale}} · awaiting verification{{end}}</summary>
      {{- if $r.Stale}}<p class="muted">{{if $r.Running}}Verification pending; the previous diff may be outdated.{{else}}Saved results may be outdated. Awaiting a fresh comparison.{{end}}</p>{{end}}
      {{- with $r.Current}}{{if .Failed}}<p class="fail">Could not verify{{with .Error}}: {{.}}{{end}}</p>{{end}}{{end}}
      <div class="targets" data-live-key="current-targets">{{range $r.Targets}}{{template "target" .}}{{end}}</div>
    </details>
    {{- with $r.LastAttempt}}
    <details class="diff applied" data-live-key="applied:{{$r.Name}}" data-key="applied:{{$r.Name}}">
      <summary>{{if eq .Status "succeeded"}}Last applied plan{{else}}Last sync attempt{{end}} · {{.Status}} · <time datetime="{{iso .Started}}">{{when .Started}}</time></summary>
      {{- with .Error}}<p class="fail">{{.}}</p>{{end}}
      <div class="targets" data-live-key="applied-targets">{{range $r.AppliedTargets}}{{template "target" .}}{{end}}</div>
    </details>
    {{- end}}
  </li>
  {{- end}}
</ul>
{{- end}}
{{- end}}

{{define "state" -}}
{{- if eq .State "failed"}}<span class="pill pill-fail">failed</span>
{{- else if eq .State "out-of-sync"}}<span class="pill pill-warn">out of sync · {{.Changes}} {{plural .Changes "change" "changes"}}</span>
{{- else if eq .State "unchecked"}}<span class="pill pill-muted">{{if .Stale}}awaiting verification{{else}}not checked yet{{end}}</span>
{{- else if eq .State "synced"}}<span class="pill pill-ok">synced · {{.Changes}} {{plural .Changes "change" "changes"}}</span>
{{- else}}<span class="pill pill-ok">in sync</span>
{{- end}}
{{- end}}

{{define "target" -}}
<div class="target" data-live-key="target:{{.Name}}">
  <h3><code>{{.Name}}</code>
    {{- with .Plan}}{{if not (.Changes)}}{{if not .Error}} <span class="muted">no changes</span>{{end}}{{end}}{{end}}
  </h3>
  {{- with .Plan}}
  <ul class="changes">
    {{- with .Error}}<li class="c-err"><span class="sign">!</span>{{.}}</li>{{end}}
    {{- if .Create}}<li class="c-add"><span class="sign">+</span>create repository</li>{{end}}
    {{- if .Privatise}}<li class="c-chg"><span class="sign">~</span>make repository private</li>{{end}}
    {{- if .Delete}}<li class="c-del"><span class="sign">−</span>delete repository</li>{{end}}
    {{- if .RefsUnknown}}<li class="c-chg"><span class="sign">~</span>refs unknown, full push</li>{{end}}
    {{- range .Refs}}
      {{- if eq .Kind "create"}}<li class="c-add"><span class="sign">+</span><code>{{.Ref}}</code> <code class="muted">{{short .New}}</code></li>
      {{- else if eq .Kind "delete"}}<li class="c-del"><span class="sign">−</span><code>{{.Ref}}</code> <code class="muted">{{short .Old}}</code></li>
      {{- else}}<li class="c-chg"><span class="sign">~</span><code>{{.Ref}}</code> <code class="muted">{{short .Old}}</code> → <code>{{short .New}}</code></li>
      {{- end}}
    {{- end}}
    {{- if .RefsOmitted}}<li class="c-note"><span class="sign">…</span>{{.RefsOmitted}} more ref {{plural .RefsOmitted "change" "changes"}}</li>{{end}}
    {{- range .Settings}}
    <li class="c-chg"><span class="sign">~</span>{{.Field}}: <span class="old">{{if .Old}}{{.Old}}{{else}}(empty){{end}}</span> → <span class="new">{{if .New}}{{.New}}{{else}}(empty){{end}}</span></li>
    {{- end}}
    {{- range .Labels}}
      {{- if eq .Kind "create"}}<li class="c-add"><span class="sign">+</span>label <b>{{.Name}}</b> <span class="swatch" data-color="{{.New.Color}}">#{{.New.Color}}</span>{{with .New.Description}} <span class="muted">{{.}}</span>{{end}}</li>
      {{- else if eq .Kind "delete"}}<li class="c-del"><span class="sign">−</span>label <b>{{.Name}}</b></li>
      {{- else}}<li class="c-chg"><span class="sign">~</span>label <b>{{.Name}}</b> <span class="old">#{{.Old.Color}}{{with .Old.Description}} {{.}}{{end}}</span> → <span class="new">#{{.New.Color}}{{with .New.Description}} {{.}}{{end}}</span></li>
      {{- end}}
    {{- end}}
    {{- range .Releases}}
      {{- if eq .Kind "create"}}<li class="c-add"><span class="sign">+</span>release <b>{{.Tag}}</b>{{with .AssetsAdded}} <span class="muted">{{len .}} {{plural (len .) "asset" "assets"}}</span>{{end}}</li>
      {{- else if eq .Kind "delete"}}<li class="c-del"><span class="sign">−</span>release <b>{{.Tag}}</b></li>
      {{- else}}<li class="c-chg"><span class="sign">~</span>release <b>{{.Tag}}</b>
        {{- range .Fields}} {{.Field}}: <span class="old">{{if .Old}}{{.Old}}{{else}}(empty){{end}}</span> → <span class="new">{{if .New}}{{.New}}{{else}}(empty){{end}}</span>{{end}}
        {{- if or .AssetsAdded .AssetsReplaced .AssetsRemoved}} <span class="muted">assets{{range .AssetsAdded}} +{{.}}{{end}}{{range .AssetsReplaced}} ~{{.}}{{end}}{{range .AssetsRemoved}} −{{.}}{{end}}</span>{{end}}</li>
      {{- end}}
    {{- end}}
    {{- range .Packages}}
    <li class="c-add"><span class="sign">+</span>package <b>{{.Package}}</b> → <code>{{.Image}}</code>: {{.Count}} {{plural .Count "tag" "tags"}}
      {{- range .Tags}} <code class="muted">{{.Tag}}</code>{{end}}{{if .TagsOmitted}} <span class="muted">…</span>{{end}}</li>
    {{- end}}
    {{- range .Warnings}}<li class="c-warn"><span class="sign">!</span>{{.}}</li>{{end}}
  </ul>
  {{- end}}
  {{- with .Last}}
  <div class="last muted">
    {{- if not .LastRun.IsZero}}
    last push:
      {{- if .Error}} <span class="fail">failed</span> <time datetime="{{iso .LastRun}}">{{when .LastRun}}</time><div class="err">{{.Error}}</div>
      {{- else}} <span class="ok">ok</span> <time datetime="{{iso .LastRun}}">{{when .LastRun}}</time> in {{round .Duration}}{{end}}
    {{- end}}
    {{- range .Operations}}
    <div>{{.Name}}: {{if .Error}}<span class="fail">failed</span> <span class="err">{{.Error}}</span>{{else}}<span class="ok">ok</span>{{end}} <time datetime="{{iso .At}}">{{when .At}}</time></div>
    {{- end}}
  </div>
  {{- end}}
</div>
{{- end}}

{{define "logs" -}}
{{- if not .Logs}}
<p class="empty muted">No log records at this level yet.</p>
{{- else}}
<table class="logs">
  <thead><tr><th>Time</th><th>Level</th><th>Message</th></tr></thead>
  <tbody>
  {{- range .Logs}}
    <tr>
      <td class="mono"><time datetime="{{iso .Time}}">{{clock .Time}}</time></td>
      <td><span class="lvl lvl-{{levelClass .Level}}">{{.Level}}</span></td>
      <td class="msg">{{.Message}}{{range .Attrs}} <span class="attr"><span class="mono muted">{{.Key}}=</span><span class="mono">{{.Value}}</span></span>{{end}}</td>
    </tr>
  {{- end}}
  </tbody>
</table>
{{- end}}
{{- end}}
