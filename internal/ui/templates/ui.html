{{define "page" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{{- /* Follow the OS text-size setting (Dynamic Type etc.); sizes are in rem, so
the layout scales with it. Browsers without support ignore it. */}}
<meta name="text-scale" content="scale">
{{- /* The indicator styles would be injected as an inline <style>, which the
Content-Security-Policy forbids; eval and script tags are never needed. */}}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>ForgeMirror</title>
<link rel="stylesheet" href="{{asset "style.css"}}">
<link rel="stylesheet" href="{{asset "controls.css"}}">
{{- /* Not deferred: it applies the stored theme before the first paint. */}}
<script src="{{asset "app.js"}}"></script>
<script src="{{asset "live.js"}}" type="module"></script>
<script src="{{asset "controls.js"}}" type="module"></script>
<script src="{{asset "toast.js"}}" type="module"></script>
<script src="{{asset "confirm.js"}}" type="module"></script>
<script src="{{asset "htmx.min.js"}}" defer></script>
</head>
<body>
{{- /* Toasts are shown in a named region that is not live itself; their text
is announced through the two regions below, which exist from page load
because screen readers ignore politeness changes made at insertion time. */}}
<div id="notifications" class="toast-region" role="region" aria-label="Notifications"></div>
<div id="announce-polite" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<div id="announce-assertive" class="visually-hidden" role="alert" aria-atomic="true"></div>
{{- /* Confirmation for hx-confirm actions; confirm.js opens it with showModal(). */}}
<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
  <form method="dialog">
    <h2 id="confirm-dialog-title" data-confirm-title>Please confirm</h2>
    <p id="confirm-dialog-message" data-confirm-message></p>
    <div class="confirm-actions">
      <button type="submit" class="btn" value="cancel" autofocus>Cancel</button>
      <button type="submit" class="btn btn-primary" value="confirm" data-confirm-accept>Confirm</button>
    </div>
  </form>
</dialog>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>ForgeMirror</h1>
  </div>
  <div class="topbar-end">
    {{- if .Auto}}
    <span class="pill pill-ok" title="Pushes, scheduled runs and deletions are applied automatically">Auto sync</span>
    {{- else}}
    <span class="pill pill-warn" title="Changes reach the targets only when you press Sync">Review mode</span>
    {{- end}}
    <button type="button" id="theme-toggle" class="btn btn-ghost" hidden>Theme: system</button>
  </div>
</header>
<main>
  <section id="overview" class="card" aria-labelledby="pipeline-heading" hx-get="fragments/overview" hx-trigger="every {{.Refresh}}, forgemirror:activity from:body" hx-swap="innerHTML" hx-sync="this:drop">
    {{template "overview" .}}
  </section>
  {{if .Actions}}<section id="controls" class="card controls-card" hx-get="fragments/controls" hx-trigger="every {{.Refresh}}" hx-swap="innerHTML" hx-sync="this:drop">{{template "controls" .}}</section>{{end}}
  <section id="repos" class="card" hx-get="fragments/repos" hx-trigger="every {{.Refresh}}, hold-changed" hx-swap="innerHTML" hx-sync="this:drop">
    {{template "repos" .}}
  </section>
  <section class="card">
    <div class="card-head">
      <h2 id="logs-heading"><button type="button" class="card-toggle" data-card-toggle="logs" aria-expanded="true" aria-controls="logs-body"><span class="card-toggle-icon">{{template "control-chevron"}}</span>Logs</button></h2>
      <form class="toolbar" action="./" method="get">
        <label for="log-level">Level</label>
        <select id="log-level" name="level" hx-get="fragments/logs" hx-target="#logs" hx-trigger="change">
          {{- range .Levels}}
          <option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
          {{- end}}
        </select>
        <noscript><button type="submit" class="btn">Filter</button></noscript>
      </form>
    </div>
    <div id="logs-body" class="card-body" data-card-body="logs">
    <div id="logs" class="scroll logs-box" hx-get="fragments/logs" hx-trigger="every {{.Refresh}}" hx-include="#log-level" hx-swap="innerHTML" hx-sync="this:drop">
      {{template "logs" .}}
    </div>
    </div>
  </section>
  <section class="card config">
    <div class="card-head">
      <div class="card-title-row">
        <h2 id="config-heading"><button type="button" class="card-toggle" data-card-toggle="config" aria-expanded="true" aria-controls="config-body"><span class="card-toggle-icon">{{template "control-chevron"}}</span>Configuration</button></h2>
        <p class="summary">Effective configuration after defaults, file, environment and flags. Secrets are redacted.</p>
      </div>
    </div>
    <div id="config-body" class="card-body" data-card-body="config">
      <pre>{{.Config}}</pre>
    </div>
  </section>
</main>
<footer class="foot muted">
  <p>Live data checked every {{.Refresh}} · updates pause while selecting text</p>
  <p class="build">
  {{- with .Build}}ForgeMirror {{release .Version}}{{with .Commit}} · commit <code title="{{.}}">{{short .}}</code>{{end}}{{if .Modified}}-dirty{{end}}{{with .GoVersion}} · {{.}}{{end}}
  {{- end}} · <span class="uptime">up <time datetime="{{iso .Snapshot.Started}}" title="since {{clock .Snapshot.Started}} UTC" data-uptime-ms="{{elapsedMs .Snapshot.Started}}">{{uptime .Snapshot.Started}}</time></span></p>
</footer>
</body>
</html>
{{- end}}

{{define "overview" -}}
{{- /* The pipeline reads left to right: what starts work, ForgeMirror, where
it goes. Lines are CSS borders and purely decorative; each list item carries
its state as text, so the structure also works for screen readers. */}}
{{- with .Pipeline}}
<div class="card-head">
  <div class="card-title-row">
    <h2 id="pipeline-heading"><button type="button" class="card-toggle" data-card-toggle="pipeline" aria-expanded="true" aria-controls="pipeline-body"><span class="card-toggle-icon">{{template "control-chevron"}}</span>Pipeline</button></h2>
    <p class="summary">What starts a sync, and where it is published</p>
  </div>
</div>
<div id="pipeline-body" class="card-body pl-flow" data-card-body="pipeline">
<ul class="pl-triggers{{if .Live}} pl-live{{end}}" role="list" aria-label="Triggers">
  {{- range .Triggers}}
  <li class="{{if .Running}}pl-fired{{else if not .Enabled}}pl-off{{end}}" data-trigger="{{.Key}}">
    <span class="pl-source{{if .Failed}} fail{{end}}">{{if .Failed}}sweep failed{{else}}{{.Source}}{{end}}</span>
    <span class="pl-pill{{if .Running}} pl-pill-fired{{else if .Failed}} pl-pill-fail{{else if and .Enabled (ne .Key "manual") (ne .Key "retry")}} pl-pill-on{{else if not .Enabled}} pl-pill-off{{end}}">
      {{- if .Running}}<span aria-hidden="true">{{if eq .Key "push"}}⚡{{else if eq .Key "schedule"}}⏱{{else if eq .Key "retry"}}↻{{else}}▶{{end}}</span> {{else if .Failed}}<span aria-hidden="true">!</span> {{else if and .Enabled (ne .Key "manual") (ne .Key "retry")}}<span aria-hidden="true">✓</span> {{end}}
      {{- .Label}}{{if and (not .Enabled) (not .Running)}} off{{end}}{{if and .Running (gt .Running 1)}} · {{.Running}}{{end}}
      <span class="visually-hidden">: {{if .Running}}started {{.Running}} running {{plural .Running "repository" "repositories"}}{{else if .Failed}}last sweep failed{{else if .Enabled}}on{{else}}off{{end}}</span>
    </span>
  </li>
  {{- end}}
</ul>
<span class="pl-wire{{if .Live}} pl-live{{end}}" aria-hidden="true"><i></i></span>
{{- with .Engine}}
<p class="pl-engine{{if .Busy}} pl-busy{{end}}">
  <span class="pl-engine-name">{{if .Busy}}{{template "spinner" .}} {{end}}ForgeMirror</span>
  <small>{{.Line}}{{with .By}} · <b>{{.}}</b>{{end}}{{if .Queued}} · {{.Queued}} queued{{end}}
    {{- if .FirstSweep}} · first sweep running{{end}}
    {{- if not .NextSweep.IsZero}} · next sweep <time datetime="{{iso .NextSweep}}">{{clock .NextSweep}} UTC</time>{{end}}
    {{- if and (not .Busy) .Error}} · <span class="fail">last sweep failed:</span> <span class="err">{{.Error}}</span>{{end}}</small>
</p>
{{- end}}
<span class="pl-wire pl-wire-short{{if .Live}} pl-live{{end}}" aria-hidden="true"><i></i></span>
<ul class="pl-targets{{if .Live}} pl-live{{end}}" role="list" aria-label="Targets">
  {{- range .Targets}}
  {{- $forge := forgeName .Name}}
  <li class="pl-{{.State}}" data-target="{{.Name}}">
    <span class="pl-chip">{{if eq .State "held"}}<span aria-hidden="true">⏸</span> {{end}}{{template "forge-icon" $forge.Icon}}{{$forge.Label}}
      {{- if eq .State "busy"}} {{template "spinner" .}}{{else if eq .State "done"}} <span class="ok" aria-hidden="true">✓</span>{{else if eq .State "failed"}} <span class="fail" aria-hidden="true">!</span>{{end}}
      <span class="visually-hidden">: {{if eq .State "busy"}}pushing{{else if eq .State "done"}}pushed{{else if eq .State "idle"}}ready{{else}}{{.State}}{{end}},</span></span>
    {{- if .Note}}<span class="pl-note">{{.Note}}</span>{{end}}
  </li>
  {{- end}}
  {{- with .Available}}
  <li class="pl-available"><span class="pl-chip">+{{len .}} available</span><span class="pl-note">{{range $i, $l := .}}{{if $i}}, {{end}}{{$l}}{{end}}</span></li>
  {{- end}}
</ul>
</div>
{{- end}}
{{- end}}

{{define "repos" -}}
<div class="card-head">
  <div>
    <div class="card-title-row">
    <h2 id="repos-heading"><button type="button" class="card-toggle" data-card-toggle="repos" aria-expanded="true" aria-controls="repos-body"><span class="card-toggle-icon">{{template "control-chevron"}}</span>Repositories</button></h2>
    <p class="summary">
      {{- len .Repos}} {{plural (len .Repos) "repository" "repositories"}}
      {{- if .Counts.OutOfSync}} · <span class="warn">{{.Counts.OutOfSync}} out of sync</span>{{end}}
      {{- if .Counts.Failed}} · <span class="fail">{{.Counts.Failed}} failed</span>{{end}}
      {{- if .Counts.HeldTargets}} · <span class="warn">{{.Counts.HeldTargets}} destinations held</span>{{end}}
    </p>
    </div>
    {{- /* Not a live region: it is re-rendered on every poll and would announce
    transient progress; action outcomes are announced by toasts. */}}
    {{with .Activity}}<p class="activity" data-global-activity data-live-key="global-activity">{{template "spinner" .}} {{.}}</p>{{end}}
  </div>
  {{- if .Actions}}
  <div class="toolbar" data-live-key="global-actions" hx-sync="#repos:queue all">
    <form class="run-action" data-live-key="refresh-all" aria-busy="false" method="post" action="actions/refresh" hx-post="actions/refresh" hx-target="#repos" hx-swap="innerHTML">
      <button type="submit" class="btn"><span class="request-spinner">{{template "spinner" .}}</span>Refresh all</button>
    </form>
    <form class="run-action" data-live-key="sync-all" aria-busy="false" method="post" action="actions/sync" hx-post="actions/sync" hx-target="#repos" hx-swap="innerHTML"
      hx-confirm="{{if eq .Counts.Pending 1}}Sync the out-of-sync repository{{else}}Sync all {{.Counts.Pending}} out-of-sync repositories{{end}} to the targets?" data-confirm-title="Sync all repositories" data-confirm-label="Sync all">
      <button type="submit" class="btn btn-primary"{{if not .Counts.Pending}} disabled{{end}}><span class="request-spinner">{{template "spinner" .}}</span>Sync all{{if .Counts.Pending}} ({{.Counts.Pending}}){{end}}</button>
    </form>
  </div>
  {{- end}}
</div>
<div id="repos-body" class="card-body" data-card-body="repos">
{{- with .Snapshot.Error}}<p class="notice fail" role="alert">{{.}}</p>{{end}}
{{with .Retries}}<details data-live-key="retry-status"><summary>Retry status · {{len .}}</summary>
{{range .}}<p><code>{{.Repo}}</code> → {{template "forge-name" .Target}}: {{.State}} · {{.Attempts}} failures{{if or (eq .State "waiting") (eq .State "paused")}} · next eligible <time datetime="{{iso .Next}}">{{when .Next}}</time>{{end}}</p>{{end}}
</details>{{end}}
{{- if not .Repos}}
<p class="empty muted">No repositories yet. They appear after the first push, scheduled sweep or refresh.</p>
{{- else}}
<ul class="repos" data-live-key="repository-list">
  {{- range $r := .Repos}}
  <li class="repo state-{{$r.State}}" data-repo="{{$r.Name}}" data-live-key="repo:{{$r.Name}}">
    <div class="repo-head" data-live-key="repository-heading">
      {{- /* The dot's shape, not only its colour, encodes the state (WCAG 1.4.1). */}}
      <span class="dot" aria-hidden="true" title="{{template "state-label" $r.State}}"></span>
      <code class="repo-name">{{$r.Name}}</code><span class="visually-hidden">, {{template "state-label" $r.State}}</span>
      <span class="forge-badges" data-live-key="forge-badges">{{range $r.Targets}}{{template "forge-badge" .Badge}}{{end}}</span>
      {{with $r.Activity}}<span class="pill pill-info activity" data-repository-activity data-activity="{{.Kind}}" data-live-key="repository-activity">{{template "spinner" .}} {{.Label}}</span>{{end}}
      {{if $r.Queued}}<span class="pill pill-muted">queued</span>{{end}}
      {{- with $r.Current}}
      <span class="checked muted">checked <time datetime="{{iso .At}}">{{when .At}}</time></span>
      {{- end}}
      <a class="btn btn-small" href="history?repo={{urlquery $r.Name}}">History</a>
      {{- if and $.Actions $r.Actionable}}
      <div class="repo-actions" data-live-key="repository-actions" aria-busy="{{if $r.Activity}}true{{else}}false{{end}}" hx-sync="#repos:queue all">
        <form class="run-action" data-live-key="refresh" aria-busy="false" method="post" action="actions/refresh" hx-post="actions/refresh" hx-target="#repos" hx-swap="innerHTML">
          <input type="hidden" name="repo" value="{{$r.Name}}">
          <button type="submit" class="btn btn-small"><span class="request-spinner">{{template "spinner" .}}</span>Refresh</button>
        </form>
        <form class="run-action" data-live-key="sync" aria-busy="false" method="post" action="actions/sync" hx-post="actions/sync" hx-target="#repos" hx-swap="innerHTML">
          <input type="hidden" name="repo" value="{{$r.Name}}">
          <button type="submit" class="btn btn-small{{if eq $r.State "out-of-sync"}} btn-primary{{end}}"><span class="request-spinner">{{template "spinner" .}}</span>Sync</button>
        </form>
        <form method="post" action="actions/repair-lfs" hx-post="actions/repair-lfs" hx-target="#repos" hx-swap="innerHTML">
          <input type="hidden" name="repo" value="{{$r.Name}}">
          <button type="submit" class="btn btn-small" title="Reconcile source-history LFS objects without publishing Git refs; may transfer large files">Repair LFS</button>
        </form>
      </div>
      {{- end}}
    </div>
    <details class="diff" data-live-key="current:{{$r.Name}}" data-key="current:{{$r.Name}}"{{if or $r.HeldTargets (and (eq $r.State "out-of-sync") (not $.Auto))}} data-open-default{{end}}>
      <summary>Current diff{{if $r.DistinctChanges}} · {{$r.DistinctChanges}} {{plural $r.DistinctChanges "change" "changes"}}{{end}}{{if $r.Stale}} · awaiting verification{{end}}</summary>
      {{- if $r.Stale}}<p class="muted">{{if $r.Running}}Verification pending; the previous diff may be outdated.{{else}}Saved results may be outdated. Awaiting a fresh comparison.{{end}}</p>{{end}}
      {{- with $r.Current}}{{if .Failed}}<p class="fail">Could not verify{{with .Error}}: {{.}}{{end}}</p>{{end}}{{end}}
      <ul class="changes grouped-changes" data-live-key="current-changes">{{range $r.ChangeGroups}}{{template "change-rows" .}}{{else}}<li class="c-note">{{if $r.Stale}}Awaiting a fresh comparison.{{else}}no changes{{end}}</li>{{end}}</ul>
      <details class="target-details" data-live-key="target-details"><summary>Target details{{if $r.HeldTargets}} · {{$r.HeldTargets}} destinations held{{end}}</summary>
        <div class="targets" data-live-key="current-targets">{{range $r.Targets}}{{template "target-details" .}}{{end}}</div>
      </details>
    </details>
    {{- with $r.LastAttempt}}
    <details class="diff applied" data-live-key="applied:{{$r.Name}}" data-key="applied:{{$r.Name}}">
      <summary>{{if eq .Status "succeeded"}}Last applied plan{{else}}Last sync attempt{{end}} · {{.Status}} · <time datetime="{{iso .Started}}">{{when .Started}}</time></summary>
      {{- with .Error}}<p class="fail">{{.}}</p>{{end}}
      <div class="targets" data-live-key="applied-targets">{{range $r.AppliedTargets}}{{template "target" .}}{{end}}</div>
    </details>
    {{- end}}
  </li>
  {{- end}}
</ul>
{{- end}}
</div>
{{- end}}

{{define "state-label" -}}
{{if eq . "failed"}}failed{{else if eq . "out-of-sync"}}out of sync{{else if eq . "unchecked"}}not checked yet{{else if eq . "synced"}}synced{{else if eq . "in-sync"}}in sync{{else}}{{.}}{{end}}
{{- end}}

{{define "spinner" -}}<span class="spinner" aria-hidden="true"></span>{{- end}}

{{define "target" -}}
<div class="target" data-live-key="target:{{.Name}}">
  {{template "target-heading" .}}
  {{template "target-policy" .}}
  <ul class="changes">{{template "change-rows" .}}</ul>
  {{template "target-results" .}}
</div>
{{- end}}

{{define "target-details" -}}
<div class="target" data-live-key="target:{{.Name}}">
  {{template "target-heading" .}}
  {{template "target-policy" .}}
  {{template "target-results" .}}
</div>
{{- end}}

{{define "target-heading" -}}
<h3><code>{{template "forge-name" .Name}}</code>{{with .Pause}} <span class="pill pill-warn">paused</span>{{end}}
  {{- with .Plan}}{{if not (.Changes)}}{{if not .Error}} <span class="muted">no changes</span>{{end}}{{end}}{{end}}
</h3>
{{- end}}

{{define "target-policy" -}}
  {{with .Publication}}{{template "publication" .}}{{end}}
  {{$target := .}}
  {{with .Plan}}{{if .ApprovalRequired}}
    {{with .URL}}<p><a href="{{.}}" rel="noreferrer">Destination repository</a></p>{{end}}
    {{if and $target.Actionable .PublicationID}}
    <form method="post" action="actions/approve" hx-post="actions/approve" hx-target="#repos" hx-swap="innerHTML"
      hx-confirm="Approve ongoing publication to this destination and sync current source state? This does not approve an exact snapshot." data-confirm-title="Approve destination" data-confirm-label="Approve and sync">
      <input type="hidden" name="repo" value="{{$target.Repo}}">
      <input type="hidden" name="target" value="{{$target.Name}}">
      <input type="hidden" name="identity" value="{{.PublicationID}}">
      <button class="btn btn-small" type="submit">Approve destination and sync</button>
    </form>
    {{end}}
  {{end}}{{end}}
  {{- with .Pause}}<p class="warn">Publication paused{{with .Reason}}: {{.}}{{end}}{{if not .Until.IsZero}} until <time datetime="{{iso .Until}}">{{when .Until}}</time>{{end}}.</p>{{end}}
{{- end}}

{{define "target-results" -}}
  {{- with .Last}}
  <div class="last muted">
    {{- if not .LastRun.IsZero}}
    last push:
      {{- if .Error}} <span class="fail">failed</span> <time datetime="{{iso .LastRun}}">{{when .LastRun}}</time><div class="err">{{.Error}}</div>
      {{- else}} <span class="ok">ok</span> <time datetime="{{iso .LastRun}}">{{when .LastRun}}</time> in {{round .Duration}}{{end}}
    {{- end}}
    {{- range .Operations}}
    <div>{{.Name}}: {{if .Error}}<span class="fail">failed</span> <span class="err">{{.Error}}</span>{{else}}<span class="ok">ok</span>{{end}} <time datetime="{{iso .At}}">{{when .At}}</time></div>
    {{- end}}
  </div>
  {{- end}}
{{- end}}

{{define "logs" -}}
{{- if not .Logs}}
<p class="empty muted">No log records at this level yet.</p>
{{- else}}
<table class="logs">
  <caption class="visually-hidden">Log records, newest first</caption>
  <thead><tr><th scope="col">Time</th><th scope="col">Level</th><th scope="col">Message</th></tr></thead>
  <tbody>
  {{- range .Logs}}
    <tr>
      <td class="mono"><time datetime="{{iso .Time}}">{{clock .Time}}</time></td>
      <td><span class="lvl lvl-{{levelClass .Level}}">{{.Level}}</span></td>
      <td class="msg">{{.Message}}{{range .Attrs}} <span class="attr"><span class="mono muted">{{.Key}}=</span><span class="mono">{{.Value}}</span></span>{{end}}</td>
    </tr>
  {{- end}}
  </tbody>
</table>
{{- end}}
{{- end}}
