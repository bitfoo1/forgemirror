# Apply with: kubectl apply -k deploy/
# The Secret is not part of this kustomization on purpose: it must be created
# out of band (see secret.example.yaml), so credentials never land in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgemirror
labels:
  - pairs:
      app.kubernetes.io/name: forgemirror
    includeSelectors: true
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: git.bitfoo.de/dvonessen/forgemirror
    # Pin a released version (or better, a digest) instead of latest.
    newTag: latest
