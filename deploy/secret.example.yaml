# Template only: copy, fill in, and apply it yourself, or create it with
#   kubectl -n forgemirror create secret generic forgemirror \
#     --from-literal=webhook-secret=... \
#     --from-literal=source-token=... \
#     --from-literal=github-token=...
# Never commit the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: forgemirror
  namespace: forgemirror
type: Opaque
stringData:
  # Must match the secret configured on the Forgejo webhook.
  webhook-secret: change-me
  # Forgejo token with read access to the mirrored repositories.
  source-token: change-me
  # One key per target, referenced by token_file in the ConfigMap.
  github-token: change-me
