apiVersion: v1
kind: ConfigMap
metadata:
  name: forgemirror
data:
  # Non-secret settings only. Secrets are read from files mounted from the
  # forgemirror Secret (see deployment.yaml and secret.example.yaml).
  forgemirror.yaml: |
    server:
      listen_address: ":8080"
      # Keep below terminationGracePeriodSeconds in deployment.yaml.
      shutdown_timeout: 60s
    log:
      level: info
      format: json
    webhook:
      secret_file: /run/secrets/forgemirror/webhook-secret
    source:
      base_url: https://git.example.org/
      token_file: /run/secrets/forgemirror/source-token
    mirror:
      timeout: 10m
      max_concurrent: 4
      work_dir: /work
    filter:
      # The target below has no {{ .Owner }}: limit it to one owner, or
      # acme/app and bob/app would overwrite the same mirror.
      include_repos: "acme/.*"
      exclude_private: true
    targets:
      - name: github
        # With a type, forgemirror also uses the GitHub API (needs the
        # source token above); create makes missing repositories.
        type: github
        url: "https://github.com/acme/{{ .Name }}.git"
        token_file: /run/secrets/forgemirror/github-token
        create: true
