apiVersion: v2
name: forgemirror
description: Mirror Forgejo repositories to GitHub, Codeberg, GitLab and other forges on every push.
type: application
# version and appVersion are replaced with the release version when the chart
# is packaged (mise run release:publish), so chart and app never drift apart.
version: 0.0.0
appVersion: 0.0.0
kubeVersion: ">=1.31.0-0"
home: https://git.bitfoo.de/dvonessen/forgemirror
sources:
  - https://git.bitfoo.de/dvonessen/forgemirror
keywords: [forgejo, git, mirror, webhook]
dependencies:
  - name: common
    repository: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
