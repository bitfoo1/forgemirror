# forgemirror Helm chart values.
#
# The two forgemirror sections come first: `config` and `credentials`. The
# remaining keys are the bjw-s common library (5.3.0) values, preconfigured
# for forgemirror. Anything documented at
# https://bjw-s-labs.github.io/helm-charts/docs/common-library/ can be
# overridden here, e.g. ingress, serviceMonitor, networkpolicies.

# -- forgemirror configuration, rendered verbatim into forgemirror.yaml.
# Reference: forgemirror.example.yaml in the repository. Secrets belong in
# `credentials`; reference them here with *_file paths under
# /run/secrets/forgemirror/.
config:
  server:
    # The ports must match service.forgemirror.ports below.
    listen_address: ":8081"
    ops_listen_address: ":9090"
    # Keep below terminationGracePeriodSeconds (defaultPodOptions below).
    shutdown_timeout: 60s
  log:
    level: info
    format: json
  webhook:
    secret_file: /run/secrets/forgemirror/webhook-secret
  mirror:
    timeout: 10m
    max_concurrent: 4
    work_dir: /work
  filter: {}
  ui:
    # -- Serve the web UI (status, diffs, refresh and sync) on port 8080 (service port "web").
    enabled: false
  # -- Required: at least one target. `url` is a Go text/template, e.g.
  #   - name: github
  #     url: "https://github.com/acme/{{ .Name }}.git"
  #     token_file: /run/secrets/forgemirror/github-token
  targets: []

# -- Files mounted read-only under /run/secrets/forgemirror/.
credentials:
  # -- Name of an existing Secret to mount (recommended: create it with
  # External Secrets, SOPS or sealed-secrets). Takes precedence over `data`.
  existingSecret: ""
  # -- Key/value pairs for a Secret created by the chart. Keys become file
  # names, e.g. webhook-secret, source-token, github-token.
  data: {}

global:
  # Resources are named after the release; with the release name
  # "forgemirror" they are simply "forgemirror".
  fullnameOverride: null
  # forgemirror's target URLs are Go templates ({{ .Name }}); keep the library
  # from evaluating them as Helm templates.
  templateEvaluation:
    excludePaths:
      - [config]
      - [configMaps, config, data]

defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  # Must exceed config.server.shutdown_timeout so running mirrors can finish
  # before the kubelet sends SIGKILL.
  terminationGracePeriodSeconds: 75
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

controllers:
  forgemirror:
    # One replica, Recreate: coalescing of concurrent pushes lives in memory,
    # so two pods could push the same repository at the same time.
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image:
          repository: git.bitfoo.de/dvonessen/forgemirror
          # -- Defaults to the chart's appVersion.
          tag: "{{ .Chart.AppVersion }}"
          pullPolicy: IfNotPresent
        args: ["--config", "/etc/forgemirror/forgemirror.yaml"]
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9090
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 9090
              periodSeconds: 5
          startup:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            # git clone of large repositories is memory hungry; raise this
            # together with config.mirror.max_concurrent.
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]

service:
  forgemirror:
    controller: forgemirror
    # One port per audience, so each can be exposed or locked down as a
    # whole: webhook for Forgejo, ops for probes and Prometheus (keep it
    # cluster-internal), web for the UI (listening only with
    # config.ui.enabled).
    ports:
      webhook:
        primary: true
        port: 8081
      ops:
        port: 9090
      web:
        port: 8080

# Both ingresses are off by default. Each is a plain bjw-s ingress: set
# className, annotations (e.g. for your SSO or proxy), hosts and tls. Leave
# web disabled to keep the UI cluster-internal, e.g. when exposing it with
# Traefik's IngressRoute and a middleware managed outside this chart.
ingress:
  # -- The web UI. It has no authentication of its own: secure it with
  # annotations (oauth2-proxy, Authelia, ...) or your ingress controller.
  # Requires config.ui.enabled.
  web:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: forgemirror.example.org
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: forgemirror
              port: web
    tls: []
  # -- The webhook, for a Forgejo that cannot reach the cluster-internal
  # Service (e.g. running in another cluster). Requests without a valid HMAC
  # signature are rejected; this port serves nothing else.
  webhook:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: forgemirror-webhook.example.org
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: forgemirror
              port: webhook
    tls: []

persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /etc/forgemirror
        readOnly: true
  credentials:
    # type and Secret reference are derived from `credentials`.
    defaultMode: 0440
    globalMounts:
      - path: /run/secrets/forgemirror
        readOnly: true
  work:
    # Temporary clones; the root filesystem stays read-only. sizeLimit evicts
    # the pod instead of filling the node.
    type: emptyDir
    sizeLimit: 5Gi
    globalMounts:
      - path: /work
  tmp:
    type: emptyDir
    sizeLimit: 100Mi
    globalMounts:
      - path: /tmp

serviceMonitor:
  forgemirror:
    # -- Requires the Prometheus Operator CRDs.
    enabled: false
    serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    endpoints:
      - port: ops
        path: /metrics
        interval: 1m
